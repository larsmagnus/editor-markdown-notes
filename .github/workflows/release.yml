name: 📦 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Setup pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The checks run again here rather than trusting main's green run:
      # releases are rare, and the tagged tree is what actually ships.
      - name: ✨ Run typecheck, lint and format checks
        run: pnpm lint:check

      - name: 🤯 Run code complexity checks
        run: pnpm complexity

      - name: 🧬 Run duplication checks
        run: pnpm duplication:check

      - name: 🧹 Run unused code and dependency checks
        run: pnpm knip

      - name: 🧪 Run VS Code, Vitest and Playwright tests
        run: xvfb-run --auto-servernum pnpm test

      # The vsix filename and the version users install come from package.json,
      # while the Release is named for the tag. Nothing else makes them agree.
      - name: 🔍 Check the tag matches package.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$MANIFEST" || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version $MANIFEST"
            exit 1
          }

      - name: 📦 Package the extension
        run: pnpm vscode:package

      # The tag is `v0.19.0` but the changelog heading is `## [0.19.0]`, hence the strip.
      - name: 📝 Extract release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            /^## \[/ { f = 0 }
            f
          ' CHANGELOG.md > NOTES.md
          # Not `test -s`: awk emits the blank line under the heading, so a
          # heading whose entries are still sitting under [Unreleased] yields one
          # byte and would publish a Release with empty notes.
          grep -q '[^[:space:]]' NOTES.md || {
            echo "No changelog entries for $VERSION"
            exit 1
          }

      - name: 🚀 Create the GitHub Release
        run: gh release create "$GITHUB_REF_NAME" ./*.vsix --title "$GITHUB_REF_NAME" --notes-file NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
