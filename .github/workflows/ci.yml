name: 🚀 CI

on:
  push:
    branches:
      - main
    # Skip CI for docs-only changes to save compute
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.storybook/**'
      - '.vscode/**'

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Setup pnpm
      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🎭 Install Playwright browsers
        run: pnpm exec playwright install --with-deps --only-shell chromium

      - name: ✨ Run typecheck, lint and format checks
        run: pnpm lint:check

      - name: 🤯 Run code complexity checks
        run: pnpm complexity

      - name: 🧬 Run duplication checks
        run: pnpm duplication:check

      - name: 🧹 Run unused code and dependency checks
        run: pnpm knip

      - name: 🧪 Run VS Code, Vitest and Playwright tests
        run: xvfb-run --auto-servernum pnpm test
